<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mystical Garden — Sign In</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --pink: #e8557a; --pink-light: #fce8ee; --pink-mid: #f5c6d4;
      --cream: #fdf6f0; --text: #2d1f1f; --muted: #9a7070;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::after {
      content: '🌷';
      position: fixed; font-size: 300px; opacity: 0.04;
      bottom: -80px; left: -80px; pointer-events: none;
    }

    /* ── Card ── */
    .signin-card {
      background: white;
      border-radius: 28px;
      padding: 48px 44px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(232,85,122,0.12);
      border: 1px solid var(--pink-mid);
      position: relative;
      z-index: 1;
    }

    /* ── Header ── */
    .signin-logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-style: italic;
      color: var(--pink);
      text-decoration: none;
      display: block;
      margin-bottom: 28px;
    }
    .signin-header { margin-bottom: 32px; }
    .signin-header .sec-tag {
      display: inline-block;
      font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--pink); border: 1px solid var(--pink-mid);
      padding: 5px 14px; border-radius: 999px; margin-bottom: 12px;
      background: var(--pink-light);
    }
    .signin-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 30px; color: var(--text); line-height: 1.2;
    }
    .signin-header h1 em { color: var(--pink); font-style: italic; }
    .signin-header p { color: var(--muted); font-size: 14px; margin-top: 8px; line-height: 1.6; }

    /* ── Form ── */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    .form-group input {
      width: 100%; padding: 13px 16px;
      border: 1.5px solid var(--pink-mid);
      border-radius: 12px;
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(232,85,122,0.1);
    }
    .form-group input::placeholder { color: #c9a0a0; }

    /* Password show/hide */
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 44px; }
    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 16px; color: var(--muted);
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--pink); }

    /* Error message */
    .error-msg {
      display: none;
      background: #ffeaea;
      border: 1px solid #f5c6c6;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #c0392b;
      margin-bottom: 16px;
    }
    .error-msg.show { display: block; }

    /* Submit button */
    .btn-signin {
      width: 100%; padding: 14px;
      background: var(--pink); color: white;
      border: none; border-radius: 999px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: all 0.25s;
      box-shadow: 0 6px 20px rgba(232,85,122,0.3);
      margin-top: 8px;
    }
    .btn-signin:hover { background: #d44068; transform: translateY(-2px); }
    .btn-signin:active { transform: translateY(0); }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0; color: var(--muted); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--pink-mid);
    }

    /* Back link */
    .back-link {
      text-align: center; margin-top: 20px;
    }
    .back-link a {
      font-size: 13px; color: var(--muted); text-decoration: none;
      transition: color 0.2s;
    }
    .back-link a:hover { color: var(--pink); }
    .back-link a span { color: var(--pink); font-weight: 600; }

    /* Success state */
    .success-msg {
      display: none;
      text-align: center;
      padding: 20px 0;
    }
    .success-msg.show { display: block; }
    .success-icon { font-size: 48px; margin-bottom: 12px; }
    .success-msg h3 {
      font-family: 'Playfair Display', serif;
      font-size: 22px; color: var(--text); margin-bottom: 8px;
    }
    .success-msg h3 em { color: var(--pink); font-style: italic; }
    .success-msg p { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

  <div class="signin-card">
    <a href="index.html" class="signin-logo">Mystical Garden</a>

    <div class="signin-header">
      <div class="sec-tag">✦ Welcome Back</div>
      <h1>Sign <em>In</em></h1>
      <p>Enter your details to continue shopping and checkout your cart.</p>
    </div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg">⚠️ Please fill in all fields correctly.</div>

    <!-- Form -->
    <div id="signInForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="inputName" placeholder="e.g. Maria Santos"/>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="inputEmail" placeholder="e.g. maria@gmail.com"/>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" id="inputPassword" placeholder="Enter your password"/>
          <button class="toggle-pw" onclick="togglePassword()" type="button">👁️</button>
        </div>
      </div>

      <button class="btn-signin" onclick="signIn()">Sign In </button>

      <div class="divider">or</div>

      <div class="back-link">
        <a href="index.html">Back to <span>Shop</span></a>
      </div>
    </div>

    <!-- Success -->
    <div class="success-msg" id="successMsg">
      <div class="success-icon">🌸</div>
      <h3>Welcome, <em id="welcomeName"></em>!</h3>
      <p>You're now signed in. Redirecting you back...</p>
      <a href="index.html"></a>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('inputPassword');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function signIn() {
      const name = document.getElementById('inputName').value.trim();
      const email = document.getElementById('inputEmail').value.trim();
      const password = document.getElementById('inputPassword').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      // Basic validation
      if (!name || !email || !password) {
        errorMsg.textContent = '⚠️ Please fill in all fields.';
        errorMsg.classList.add('show');
        return;
      }

      if (!email.includes('@')) {
        errorMsg.textContent = '⚠️ Please enter a valid email address.';
        errorMsg.classList.add('show');
        return;
      }

      if (password.length < 6) {
        errorMsg.textContent = '⚠️ Password must be at least 6 characters.';
        errorMsg.classList.add('show');
        return;
      }

      errorMsg.classList.remove('show');

      // Save to localStorage
      const user = { name, email, password };
      localStorage.setItem('mg_user', JSON.stringify(user));

      // Show success
      document.getElementById('signInForm').style.display = 'none';
      document.getElementById('welcomeName').textContent = name.split(' ')[0];
      document.getElementById('successMsg').classList.add('show');

      // Redirect after 2 seconds
      setTimeout(() => {
        const cart = JSON.parse(localStorage.getItem('mg_cart')) || [];
        if (cart.length > 0) {
          window.location.href = 'checkout.html';
        } else {
          window.location.href = 'shop.html';
        }
      }, 2000);
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') signIn();
    });

  </script>

</body>
</html>
